[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Permalink redirects for clean URLs
[[redirects]]
  from = "/comedian/:id"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/venue/:id"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/group/:id"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile/:username"
  to = "/index.html"
  status = 200

# API redirects for development
[[redirects]]
  from = "/api/*"
  to = "http://localhost:3001/:splat"
  status = 200
  conditions = {Cookie = ["netlify-dev-login=*"]}

# Fallback for SPA - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Maximum Security Configuration - Addresses All Meterian Security Issues
[[headers]]
  for = "/*"
  [headers.values]
    # Core Security Headers (CWE-346, CWE-79, CWE-200 mitigation)
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Maximum Security CSP (Addresses injection vulnerabilities)
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:3001; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; worker-src 'none'; child-src 'none'; form-action 'self'; frame-src 'none'; manifest-src 'self';"
    
    # Enhanced Transport Security (Addresses man-in-the-middle attacks)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    
    # Complete Feature Policy Lockdown (Addresses plugin vulnerabilities)
    Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    
    # Additional Security Headers
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    
    # Additional Security Headers
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Asset caching with optimized permalinks
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent caching of HTML files for proper permalink updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SEO-friendly permalink headers
[[headers]]
  for = "/comedian/*"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"

[[headers]]
  for = "/venue/*"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"

[[headers]]
  for = "/profile/*"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=300"